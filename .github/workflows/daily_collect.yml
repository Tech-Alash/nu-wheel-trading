name: Daily Options Data Collection

on:
  # Каждый день в 20:30 UTC = 01:30 Алматы (после закрытия US рынка)
  schedule:
    - cron: '30 20 * * 1-5'   # Пн-Пт (рынок работает Mon-Fri)

  # Ручной запуск через GitHub UI
  workflow_dispatch:
    inputs:
      force_refresh:
        description: 'Удалить старый файл и пересобрать'
        required: false
        default: 'false'

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: write   # чтобы коммитить данные обратно

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install yfinance pandas numpy scipy requests

      - name: Force refresh (if requested)
        if: github.event.inputs.force_refresh == 'true'
        run: |
          DATE=$(date +%Y-%m-%d)
          rm -f "data/raw/options_${DATE}.csv"
          echo "Deleted stale file for ${DATE}"

      - name: Run daily options collector
        run: |
          python -m src.data.daily_collector
        env:
          PYTHONPATH: ${{ github.workspace }}
          PYTHONIOENCODING: utf-8

      - name: Check results
        run: |
          DATE=$(date +%Y-%m-%d)
          FILE="data/raw/options_${DATE}.csv"
          if [ -f "$FILE" ]; then
            ROWS=$(wc -l < "$FILE")
            echo "Collected: $FILE ($ROWS rows)"
          else
            echo "WARNING: No file created!"
            exit 1
          fi

      - name: Commit and push data
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          DATE=$(date +%Y-%m-%d)
          git add "data/raw/options_${DATE}.csv"
          if git diff --staged --quiet; then
            echo "No new data to commit."
          else
            ROWS=$(wc -l < "data/raw/options_${DATE}.csv")
            git commit -m "data: daily options snapshot ${DATE} (${ROWS} rows)"
            git push
            echo "Pushed: options_${DATE}.csv"
          fi

      - name: Summary
        run: |
          DATE=$(date +%Y-%m-%d)
          echo "### Daily Collection Complete" >> $GITHUB_STEP_SUMMARY
          echo "- Date: ${DATE}" >> $GITHUB_STEP_SUMMARY
          echo "- File: data/raw/options_${DATE}.csv" >> $GITHUB_STEP_SUMMARY
          ROWS=$(wc -l < "data/raw/options_${DATE}.csv" 2>/dev/null || echo "0")
          echo "- Rows: ${ROWS}" >> $GITHUB_STEP_SUMMARY
